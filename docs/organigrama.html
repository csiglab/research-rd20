    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --link-color: #475569;
            --node-circle: #3b82f6;
            --node-collapsed: #f59e0b;
            --node-leaf: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        #chart-container {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #chart-container:active {
            cursor: grabbing;
        }

        .link {
            fill: none;
            stroke: var(--link-color);
            stroke-width: 1.5px;
            stroke-opacity: 0.6;
        }

        .node-circle {
            cursor: pointer;
            stroke-width: 2px;
            transition: all 0.2s ease;
        }

        .node-circle:hover {
            filter: brightness(1.5);
        }

        .node-text {
            font-size: 10px;
            font-weight: 500;
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        .tooltip {
            position: absolute;
            text-align: left;
            padding: 8px 12px;
            font-size: 12px;
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            border-radius: 4px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 100;
            max-width: 300px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .legend {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            z-index: 10;
        }
        .legend h3 { margin: 0 0 10px 0; font-size: 14px; color: #94a3b8; }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; font-size: 12px; }
        .legend-color { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
    </style>
</head>

    // --- 2. Data Parsing Logic ---
    function parseTree(text) {
        const lines = text.split('\n');
        const root = { name: "República Dominicana", children: [] };
        const levels = [root]; 

        lines.forEach(line => {
            if (!line.trim()) return;

            let depth = 0;
            let processedLine = line;
            
            while (processedLine.startsWith('│   ') || processedLine.startsWith('    ')) {
                depth++;
                processedLine = processedLine.substring(4);
            }

            if (processedLine.startsWith('├── ') || processedLine.startsWith('└── ')) {
                let name = processedLine.substring(4).trim();
                
                if (name.endsWith('.md')) {
                    name = name.slice(0, -3);
                }

                const node = { name: name, children: [] };
                
                const safeDepth = Math.min(depth, levels.length - 1);
                
                const parent = levels[safeDepth];
                if (parent) {
                    parent.children.push(node);
                } else {
                    root.children.push(node);
                    levels.length = 1;
                }

                levels.length = safeDepth + 1;
                levels.push(node);
            }
        });

        return root;
    }

    const data = parseTree(rawTreeText);

    // --- 3. Visualization Logic (D3.js) ---
    
    const container = document.getElementById('chart-container');
    const width = container.clientWidth;
    const height = container.clientHeight;

    const svg = d3.select('#chart-container').append('svg')
        .attr('width', width)
        .attr('height', height);

    const g = svg.append('g');

    const zoom = d3.zoom()
        .scaleExtent([0.05, 3])
        .on('zoom', (event) => {
            g.attr('transform', event.transform);
        });

    svg.call(zoom);

    // Use nodeSize for better vertical tree layout control
    // [horizontal spacing, vertical spacing]
    const treeLayout = d3.tree()
        .nodeSize([180, 200]); 

    const root = d3.hierarchy(data);
    
    // Collapse all initially
    root.descendants().forEach((d) => {
        if (d.depth > 0 && d.children) {
            d._children = d.children;
            d.children = null;
        }
    });

    root.x0 = width / 2; // Initial horizontal position
    root.y0 = 0;         // Initial vertical position

    const linksGroup = g.append('g').attr('class', 'links');
    const nodesGroup = g.append('g').attr('class', 'nodes');

    update(root);

    function update(source) {
        const duration = 400;
        
        const treeData = treeLayout(root);
        const nodes = treeData.descendants();
        const links = treeData.links();

        // --- Nodes ---
        let i = 0;
        const node = nodesGroup.selectAll('g.node')
            .data(nodes, d => d.id || (d.id = ++i));

        const nodeEnter = node.enter().append('g')
            .attr('class', 'node')
            .attr('transform', d => `translate(${source.x0},${source.y0})`)
            .on('click', (event, d) => {
                if (d.children) {
                    d._children = d.children;
                    d.children = null;
                } else if (d._children) {
                    d.children = d._children;
                    d._children = null;
                }
                update(d);
            });

        nodeEnter.append('circle')
            .attr('class', 'node-circle')
            .attr('r', 6)
            .style('fill', d => d._children ? '#f59e0b' : (d.children ? '#3b82f6' : '#10b981'))
            .style('stroke', d => d._children ? '#fcd34d' : (d.children ? '#60a5fa' : '#34d399'));

        // Text positioning for Top-Down
        nodeEnter.append('text')
            .attr('class', 'node-text')
            .attr('dy', '1.5em') // Move text below the node
            .attr('x', 0)        // Center text horizontally
            .attr('text-anchor', 'middle') // Center anchor
            .text(d => d.data.name);

        nodeEnter.on('mouseover', function(event, d) {
            const tooltip = d3.select('#tooltip');
            let path = [];
            let temp = d;
            while(temp) {
                path.push(temp.data.name);
                temp = temp.parent;
            }
            tooltip.html(`<strong>${d.data.name}</strong><br><span style="font-size:10px;opacity:0.8">${path.reverse().join(' > ')}</span>`)
                .style('left', (event.pageX + 15) + 'px')
                .style('top', (event.pageY - 28) + 'px')
                .style('opacity', 1);
        })
        .on('mouseout', function() {
            d3.select('#tooltip').style('opacity', 0);
        });

        const nodeUpdate = nodeEnter.merge(node);

        nodeUpdate.transition()
            .duration(duration)
            .attr('transform', d => `translate(${d.x},${d.y})`);

        nodeUpdate.select('circle')
            .style('fill', d => d._children ? '#f59e0b' : (d.children ? '#3b82f6' : '#10b981'))
            .style('stroke', d => d._children ? '#fcd34d' : (d.children ? '#60a5fa' : '#34d399'));

        const nodeExit = node.exit().transition()
            .duration(duration)
            .attr('transform', d => `translate(${source.x},${source.y})`)
            .remove();

        nodeExit.select('circle')
            .attr('r', 0);

        nodeExit.select('text')
            .style('fill-opacity', 0);

        // --- Links ---
        const link = linksGroup.selectAll('path.link')
            .data(links, d => d.target.id);

        const linkEnter = link.enter().insert('path', 'g')
            .attr('class', 'link')
            .attr('d', d => {
                const o = {x: source.x0, y: source.y0};
                return diagonal(o, o);
            });

        const linkUpdate = linkEnter.merge(link);

        linkUpdate.transition()
            .duration(duration)
            .attr('d', d => diagonal(d.source, d.target));

        link.exit().transition()
            .duration(duration)
            .attr('d', d => {
                const o = {x: source.x, y: source.y};
                return diagonal(o, o);
            })
            .remove();

        nodes.forEach(d => {
            d.x0 = d.x;
            d.y0 = d.y;
        });
    }

    // Updated diagonal for vertical links
    function diagonal(s, d) {
        // s = source (parent), d = target (child)
        return `M ${s.x} ${s.y}
                C ${s.x} ${(s.y + d.y) / 2},
                  ${d.x} ${(s.y + d.y) / 2},
                  ${d.x} ${d.y}`;
    }

    // Center the tree on the root initially
    // Since nodeSize is used, the root is at 0,0 in the tree coordinate system.
    // We translate the main group (g) to the center top of the screen initially.
    svg.call(zoom.transform, d3.zoomIdentity.translate(width / 2, 100).scale(1));
